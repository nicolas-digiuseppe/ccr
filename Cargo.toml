[package]
name = "ccr"
version = "0.1.0"
edition = "2021"
description = "Claude Code Resume — TUI session browser"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
anyhow = "1"
dirs = "6"
nucleo-matcher = "0.3"

[dev-dependencies]
tempfile = "3"
